services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: costguard-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-costguard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-costguard_secret}
      POSTGRES_DB: ${POSTGRES_DB:-costguard_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-costguard} -d ${POSTGRES_DB:-costguard_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: costguard-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${PORT:-8000}:8000"
    environment:
      - ENVIRONMENT=production
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-costguard}:${POSTGRES_PASSWORD:-costguard_secret}@postgres:5432/${POSTGRES_DB:-costguard_db}
      - DATABASE_SYNC_URL=postgresql+psycopg2://${POSTGRES_USER:-costguard}:${POSTGRES_PASSWORD:-costguard_secret}@postgres:5432/${POSTGRES_DB:-costguard_db}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  pgdata:

